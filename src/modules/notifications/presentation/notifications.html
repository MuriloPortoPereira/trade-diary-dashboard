<div class="page" id="page-notifications">
  <div class="page-header app-page-header">
    <div>
      <div class="page-kicker" data-i18n="notif.kicker">Monitoramento</div>
      <div class="page-title" data-i18n="notif.title">Notificações</div>
      <div class="page-sub" data-i18n="notif.sub">Alertas de risco, processo e registros que pedem revisão.</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" onclick="showPage('documents')" data-i18n="notif.openDocs">Abrir documentos</button>
      <button class="btn btn-primary btn-sm" onclick="showPage('setup')" data-i18n="notif.reviewSetup">Revisar setup</button>
    </div>
  </div>
  <div id="notificationFeed" class="notification-list"></div>
</div>
