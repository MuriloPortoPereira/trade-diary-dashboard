<div class="page" id="page-profile">
  <div class="page-header app-page-header">
    <div>
      <div class="page-kicker" data-i18n="profile.kicker">Operador</div>
      <div class="page-title" data-i18n="profile.title">Perfil</div>
      <div class="page-sub" data-i18n="profile.sub">Resumo local do operador, configuração atual e próximos focos de execução.</div>
    </div>
  </div>

  <div class="profile-grid">
    <div class="chart-card" id="profileHero"></div>
    <div class="chart-card" id="profileRiskPanel"></div>
  </div>

  <div class="profile-grid profile-grid-secondary">
    <div class="chart-card">
      <div class="chart-title" data-i18n="profile.library">Biblioteca operacional</div>
      <div id="profileTags"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title" data-i18n="profile.focus">Focos imediatos</div>
      <div id="profileFocus" class="status-list"></div>
    </div>
  </div>
</div>
