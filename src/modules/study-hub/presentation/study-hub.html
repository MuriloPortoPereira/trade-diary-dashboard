<!-- ════ SIMULAÇÕES ════ -->
<div class="page" id="page-studyHub">
  <div class="page-header app-page-header">
    <div>
      <div class="page-kicker" data-i18n="sim.kicker">Hub Integrado</div>
      <div class="page-title" data-i18n="sim.title">Simulações</div>
      <div class="page-sub" data-i18n="sim.sub">Simuladores, planos e ferramentas do Mukas Hub rodam aqui de forma nativa, no mesmo fluxo visual do app.</div>
    </div>
  </div>

  <div class="tab-nav study-hub-tabs" id="studyHubTabs">
    <button class="tab-btn active" onclick="switchStudyHubTab('propfirm', this)">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V9"/><path d="M12 16V6"/><path d="M16 16v-4"/><path d="M20 16V8"/></svg></span>
      <span data-i18n="sim.tabPropfirm">PropFirm Simulator</span>
    </button>
    <button class="tab-btn" onclick="switchStudyHubTab('plano', this)">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5h6"/><path d="M9 10h6"/><path d="M9 14h6"/><path d="M9 18h4"/></svg></span>
      <span data-i18n="sim.tabPlano">Plano de Trade</span>
    </button>
    <button class="tab-btn" onclick="switchStudyHubTab('tradesim', this)">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/><path d="M4 20h16"/></svg></span>
      <span data-i18n="sim.tabTradesim">Trade Simulator</span>
    </button>
    <button class="tab-btn" onclick="switchStudyHubTab('mental', this)">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg></span>
      <span data-i18n="sim.tabMental">Ferramentas Mentais</span>
    </button>
  </div>

  <div id="studyHubNativeRoot" class="study-hub-native-root">
    <input type="hidden" id="hubCot" value="5.80">
    <span id="hubCotBadge" style="display:none">R$ 5,80</span>
    <div id="studyHubLegacyApp" class="embed-mode"></div>
    <div class="toast" id="hubToast"></div>
  </div>
</div>
