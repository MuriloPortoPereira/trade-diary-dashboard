<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mukas Hub - Diário Profissional</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="src/styles/app-shell.css">
<link rel="stylesheet" href="src/styles/page-layout.css">
<link rel="stylesheet" href="src/styles/analysis-panels.css">
<link rel="stylesheet" href="src/modules/accounts/presentation/account-risk-and-cashflow.css">
<link rel="stylesheet" href="src/modules/analytics/presentation/strategy-comparison.css">
<link rel="stylesheet" href="src/modules/calendar/presentation/calendar-grids.css">
<link rel="stylesheet" href="src/modules/trades/presentation/trade-tables.css">
<link rel="stylesheet" href="src/styles/workspace-controls.css">
<link rel="stylesheet" href="src/modules/routine/presentation/premarket.css">
<link rel="stylesheet" href="src/modules/trades/presentation/error-chips.css">
<link rel="stylesheet" href="src/modules/data-transfer/presentation/data-transfer.css">
<link rel="stylesheet" href="src/styles/workspace-integration.css">
<link rel="stylesheet" href="src/modules/study-hub/presentation/study-hub-native.css">
<link rel="stylesheet" href="src/styles/workspace-summaries.css">
<link rel="stylesheet" href="src/modules/documents/presentation/documents.css">
<link rel="stylesheet" href="src/modules/accounts/presentation/account-overview.css">
<link rel="stylesheet" href="src/modules/partners/presentation/partners.css">
<link rel="stylesheet" href="src/styles/tag-cloud.css">
<link rel="stylesheet" href="src/styles/page-motion.css">
<link rel="stylesheet" href="src/styles/responsive.css">
<link rel="stylesheet" href="src/modules/study-hub/presentation/legacy-controls.css">
<link rel="stylesheet" href="src/modules/study-hub/presentation/legacy-panels.css">
</head>
<body>

<div id="layout">

<!-- ── TOPBAR ── -->
<header id="topbar">
  <div class="topbar-left">
    <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16"><path d="M8 1L1 4v8l7 3 7-3V4L8 1zm0 2.2l4.5 1.94L8 7.08 3.5 5.14 8 3.2zM2.5 6.5l5 2.16v4.84L2.5 11.3V6.5zm6 7V8.66l5-2.16V11.3l-5 2.2z"/></svg>
      </div>
      <div class="logo-name">Mukas <span>Hub</span> <span style="font-size:11px;color:var(--muted);font-weight:500">desktop</span></div>
    </div>
    <div class="acct-pill" id="acctPill" onclick="openModal('accountModal')">
      <div class="acct-dot" id="acctDot" style="background:var(--blue)"></div>
      <div>
        <div class="acct-name" id="acctPillName" data-i18n="topbar.selectAccount">Selecionar conta</div>
        <div class="acct-type" id="acctPillType">—</div>
      </div>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="lang-selector" id="langSelector">
      <button class="lang-btn" onclick="toggleLangMenu()" id="langBtn" title="Idioma">
        <span class="lang-flag" id="langFlag">🇧🇷</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button class="lang-option active" onclick="setLanguage('pt-BR')" data-lang="pt-BR">
          <span class="lang-flag">🇧🇷</span>
          <span>Português</span>
        </button>
        <button class="lang-option" onclick="setLanguage('en-US')" data-lang="en-US">
          <span class="lang-flag">🇺🇸</span>
          <span>English</span>
        </button>
      </div>
    </div>
  </div>

  <div class="topbar-right">
    <div class="cot-widget" id="cotWidget" title="Cotação USD/BRL">
      <span class="cot-label">USD</span>
      <input class="cot-input" id="cotInput" type="number" step="0.01" min="1" value="5.80" onchange="setCotacao(+this.value)">
      <button class="cot-refresh" id="cotRefreshBtn" onclick="fetchCotacao()" title="Atualizar cotação">
        <svg id="cotIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('tradeModal')" data-i18n="topbar.newTrade">+ Novo Trade</button>
  </div>
</header>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ── SIDEBAR ── -->
<nav id="sidebar">
  <div class="sidebar-section">
    <div class="nav-item active" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span data-i18n="nav.dashboard">Dashboard</span>
    </div>
    <div class="nav-item" onclick="showPage('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span data-i18n="nav.calendar">Diário</span>
    </div>
    <div class="nav-item" onclick="showPage('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span data-i18n="nav.log">Trades</span>
      <span class="badge" id="sideTradeCount">0</span>
    </div>
    <div class="nav-item" onclick="showPage('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span data-i18n="nav.stats">Análises</span>
    </div>
    <div class="nav-item" onclick="showPage('premarket')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span data-i18n="nav.premarket">Rotina do Trade</span>
    </div>
    <div class="nav-item" onclick="showPage('strategyHub')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>
      <span data-i18n="nav.strategies">Estratégias</span>
    </div>
    <div class="nav-item" onclick="showPage('documents')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      <span data-i18n="nav.documents">Documentos</span>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label" data-i18n="nav.tools">Ferramentas</div>
    <div class="nav-item" onclick="showPage('studyHub')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
      <span data-i18n="nav.simulations">Simulações</span>
    </div>
    <div class="nav-item" onclick="showPage('import')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span data-i18n="nav.import">Importações</span>
    </div>
    <div class="nav-item" onclick="showPage('setup')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M12 2v2M12 20v2M20 12h2M2 12h2M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41"/></svg>
      <span data-i18n="nav.setup">Risco & Setup</span>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-stats" id="topbarStats">
      <div class="sidebar-stat-saldo">
        <span class="tb-stat-lbl" data-i18n="sidebar.balance">Saldo</span>
        <span class="tb-badge" id="topBadge">—</span>
        <span class="sidebar-balance-change" id="sideBalanceChange">—</span>
      </div>
      <div class="sidebar-stat-grid">
        <div class="tb-stat"><span class="tb-stat-lbl" data-i18n="sidebar.week">Semana</span><span class="tb-stat-val" id="tbWeek">—</span><span class="tb-stat-sub" id="tbWeekSub"></span></div>
        <div class="tb-stat"><span class="tb-stat-lbl" data-i18n="sidebar.month">Mês</span><span class="tb-stat-val" id="tbMonth">—</span><span class="tb-stat-sub" id="tbMonthSub"></span></div>
        <div class="tb-stat"><span class="tb-stat-lbl" data-i18n="sidebar.ddCurrent">DD Atual</span><span class="tb-stat-val" id="tbDD">—</span><span class="tb-stat-sub" id="tbDDSub"></span></div>
        <div class="tb-stat"><span class="tb-stat-lbl" data-i18n="sidebar.goal">Meta</span><span class="tb-stat-val" id="tbGoal">—</span><span class="tb-stat-sub" id="tbGoalSub"></span></div>
      </div>
    </div>
    <div class="sidebar-meta-nav">
      <div class="nav-item nav-item-meta" onclick="showPage('notifications')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span data-i18n="nav.notifications">Notificações</span>
      </div>
      <div class="nav-item nav-item-meta" onclick="showPage('accounts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h2"/></svg>
        <span data-i18n="nav.accounts">Contas</span>
      </div>
      <div class="nav-item nav-item-meta" onclick="showPage('partners')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/><path d="M8 8l8 8"/></svg>
        <span data-i18n="nav.partners">Parceiros</span>
      </div>
      <div class="nav-item nav-item-meta" onclick="showPage('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="nav.profile">Perfil</span>
      </div>
    </div>
  </div>
</nav>

<!-- ── MAIN ── -->
<main id="main">
